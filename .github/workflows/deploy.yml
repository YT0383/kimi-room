name: build-and-deploy
on:
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch for static export
        run: |
          rm -rf src/app/api
          rm -f src/proxy.ts
          printf 'import type { NextConfig } from "next";\n\nconst nextConfig: NextConfig = {\n  output: "export",\n  images: { unoptimized: true },\n  trailingSlash: true\n};\n\nexport default nextConfig;\n' > next.config.ts
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
