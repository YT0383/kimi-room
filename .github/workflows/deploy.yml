name: build-and-deploy
on:
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: patch
        run: |
          rm -rf src/app/api
          rm -f src/proxy.ts
          cat > next.config.ts <<"EOF"
          import type { NextConfig } from "next";
          const nextConfig: NextConfig = {
            output: "export",
            images: { unoptimized: true },
            trailingSlash: true,
          };
          export default nextConfig;
          EOF
          for f in $(find src/app -name page.tsx | grep "\[*\]"); do if ! grep -q generateStaticParams "$f"; then printf "\nexport function generateStaticParams() { return []; }\n" >> "$f"; fi; done
      - run: npm install --no-audit --no-fund
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
